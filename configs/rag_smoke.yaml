# RAG, kurzer Probelauf auf val.

experiment: rag_smoke
seed: 42

prompt:
  version: authors-rag-v1

parser_version: d09-v2

eval:
  unparseable: drop

retrieval:
  catalog_xml: data/raw/cwe/cwec_v4.20.xml
  persist_dir: data/processed/cwe_index

  chunk_size: 512
  chunk_overlap: 32

  embedding_model: BAAI/bge-small-en-v1.5
  embedding_revision: 5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
  reranker_model: cross-encoder/ms-marco-MiniLM-L6-v2
  reranker_revision: c5ee24cb16019beea0893ab7796b1df96625c6b8

  embedding_prefixes: true
  query_version: authors-v1

  distance: cosine
  top_n: 20
  top_k: 5
  use_reranker: true

  query_truncation_dataset_dir: data/processed/bigvul

model:
  provider: huggingface
  name: meta-llama/Llama-3.2-3B-Instruct
  revision: 0cb88a4f764b7a12671c53f0838cd831a0843b95
  dtype: float16
  temperature: 0.6
  top_p: 0.9
  max_new_tokens: 512
  batch_size: 1

dataset:
  name: bigvul
  split: val
  dir: data/processed/bigvul

output:
  predictions_dir: results/predictions/rag_smoke
  log_experiments: false
