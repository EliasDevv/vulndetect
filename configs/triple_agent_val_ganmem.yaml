# Triple-Agent-Kontrolle auf val: Dual-Agent-Partei mit den GAN-Strategien.

experiment: triple_agent_val_ganmem
seed: 42

triple_agent:
  memory_scope: both
  final_label_rule: validator

model:
  provider: huggingface
  name: meta-llama/Llama-3.2-3B-Instruct
  revision: 0cb88a4f764b7a12671c53f0838cd831a0843b95
  dtype: float16
  temperature: 0.0
  max_new_tokens: 512
  batch_size: 2

dataset:
  name: bigvul
  split: val
  dir: data/processed/bigvul

output:
  snapshots_from: results/gan_val
  predictions_dir: results/predictions/triple_agent_val_ganmem
  log_experiments: false
