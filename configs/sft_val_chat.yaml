# SFT, Auswertung auf val im Chat-Format.

experiment: sft_val_chat
seed: 42

prompt:
  version: fig1-v3

parser_version: d09-v2

eval:
  unparseable: drop

model:
  provider: huggingface
  name: meta-llama/Llama-3.2-3B-Instruct
  revision: 0cb88a4f764b7a12671c53f0838cd831a0843b95
  dtype: float16
  adapter: models/sft_val_chat/seed42/adapter
  temperature: 0.6
  top_p: 0.9
  max_new_tokens: 256
  batch_size: 2

dataset:
  name: bigvul
  split: val
  dir: data/processed/bigvul

training:
  split: train
  format: chat
  seed: 3407
  learning_rate: 2.0e-4
  optimizer: adamw_8bit
  max_steps: 30
  lora_r: 16
  lora_alpha: 16
  lora_dropout: 0.1
  weight_decay: 0.01
  lr_scheduler_type: linear
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  warmup_steps: 5
  max_grad_norm: 1.0
  max_seq_length: 4096
  packing: false
  completion_only_loss: true
  gradient_checkpointing: true
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  quantization:
    bits: 4
    quant_type: nf4
    double_quant: true
    compute_dtype: float16

output:
  predictions_dir: results/predictions/sft_val_chat
  log_experiments: false
  adapter_dir: models/sft_val_chat/seed42/adapter
  training_manifest: results/training/sft_val_chat/seed42/training_manifest.json
