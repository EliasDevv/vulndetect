# Dual-Agent, kurzer Probelauf auf val.

experiment: dual_agent_smoke
seed: 42

parser_version: d09-v2

eval:
  unparseable: drop

dual_agent:
  prompt_set: authors-v1
  final_label_rule: validator

model:
  provider: huggingface
  name: meta-llama/Llama-3.2-3B-Instruct
  revision: 0cb88a4f764b7a12671c53f0838cd831a0843b95
  dtype: float16
  temperature: 0.6
  top_p: 0.9
  max_new_tokens: 512
  batch_size: 1

dataset:
  name: bigvul
  split: val
  dir: data/processed/bigvul

output:
  predictions_dir: results/predictions/dual_agent_smoke
  log_experiments: false
