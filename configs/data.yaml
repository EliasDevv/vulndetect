# Aufbau des Big-Vul-Datensatzes (Filter, Balancierung, Splits) fuer alle Ansaetze.

experiment: data_build
seed: 42

source:
  name: bigvul
  raw_path: data/raw/bigvul.csv

target_cwes: [CWE-119, CWE-20, CWE-399, CWE-264, CWE-200]

lang_filter: [C, C++, cpp]

balance: per_cwe

split:
  by: commit_id
  ratios: {train: 0.80, val: 0.10, test: 0.10}
  target_sizes: {train: 5000, val: 500, test: 1000}
  reference: data/reference/bigvul_splits_v1.json

output:
  dir: data/processed/bigvul
  stats_path: results/metrics/dataset_stats.json
