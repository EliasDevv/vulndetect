# Baseline-Ablation auf val: strikte Prompt-Variante der Autoren.

experiment: baseline_val_strict
seed: 42

prompt:
  version: authors-strict-v1

parser_version: d09-v2

eval:
  unparseable: drop

model:
  provider: huggingface
  name: meta-llama/Llama-3.2-3B-Instruct
  revision: 0cb88a4f764b7a12671c53f0838cd831a0843b95
  dtype: float16
  temperature: 0.6
  top_p: 0.9
  max_new_tokens: 256
  batch_size: 2

dataset:
  name: bigvul
  split: val
  dir: data/processed/bigvul

output:
  predictions_dir: results/predictions/baseline_val_strict
  log_experiments: false
